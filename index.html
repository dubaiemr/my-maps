<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="referrer" content="no-referrer">
<title>دخول</title>
<style>
:root{--g:#0a5c3c;--gold:#c9a24a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:radial-gradient(900px 600px at 70% 10%,#0f3a28,#04140e 70%);font-family:"29LT Bukra","Segoe UI",Tahoma,sans-serif;color:#f4f1e8}
.wrap{min-height:100%;display:grid;place-items:center;padding:16px}
form{width:min(380px,100%);background:rgba(8,37,26,.85);border:1px solid rgba(201,162,74,.35);border-radius:18px;padding:30px 26px;box-shadow:0 30px 70px rgba(0,0,0,.5)}
.lock{width:52px;height:52px;border-radius:14px;margin:0 auto 14px;display:grid;place-items:center;background:rgba(201,162,74,.12);border:1px solid rgba(201,162,74,.4);color:#e8cd86}
h1{font-size:19px;text-align:center;margin:0 0 4px}
p{font-size:13px;color:#9fb2a7;text-align:center;margin:0 0 22px}
label{display:block;font-size:13px;color:#d9dfd9;margin:12px 0 6px}
input{width:100%;padding:11px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.15);background:rgba(2,12,8,.6);color:#fff;font-size:15px;outline:none;direction:ltr;text-align:left}
input:focus{border-color:var(--gold)}
button{width:100%;margin-top:20px;padding:12px;border:0;border-radius:11px;background:linear-gradient(135deg,#e8cd86,var(--gold));color:#04140e;font-weight:700;font-size:15px;cursor:pointer;font-family:inherit}
button:disabled{opacity:.6;cursor:wait}
.err{min-height:20px;margin-top:12px;font-size:13px;color:#ff9a8a;text-align:center}
.foot{font-size:11px;color:#66706b;text-align:center;margin-top:16px}
</style>
</head>
<body>
<div class="wrap">
<form id="f" autocomplete="off">
  <div class="lock"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div>
  <h1>محتوى محمي</h1>
  <p>للاستخدام الرسمي فقط</p>
  <label for="u">اسم المستخدم</label>
  <input id="u" name="u" autocomplete="off" autocapitalize="off" spellcheck="false" required>
  <label for="p">كلمة المرور</label>
  <input id="p" name="p" type="password" autocomplete="new-password" required>
  <button id="b" type="submit">دخول</button>
  <div class="err" id="e"></div>
  <div class="foot">المحتوى مشفّر بالكامل ولا يُفك إلا ببيانات الدخول الصحيحة</div>
</form>
</div>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
let fails=0, lockUntil=0;
async function unlock(user, pw){
  const enc=new TextEncoder(), salt=b64(SALT), us=enc.encode(user);
  const s=new Uint8Array(salt.length+us.length); s.set(salt); s.set(us, salt.length);
  const base=await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2', salt:s, iterations:ITER, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const gz=await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(IV), additionalData:enc.encode('dp-consulates-v1')}, key, b64(CT));
  const html=await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  return html;
}
document.getElementById('f').addEventListener('submit', async ev=>{
  ev.preventDefault();
  const e=document.getElementById('e'), b=document.getElementById('b');
  const now=Date.now(); if(now<lockUntil){ e.textContent='انتظر '+Math.ceil((lockUntil-now)/1000)+' ثانية'; return; }
  b.disabled=true; b.textContent='جاري التحقق…'; e.textContent='';
  const u=document.getElementById('u').value.trim(), p=document.getElementById('p').value;
  try{
    const html=await unlock(u,p);
    document.getElementById('p').value='';
    document.open(); document.write(html); document.close();
  }catch(err){
    fails++; lockUntil=Date.now()+Math.min(60000, 1500*Math.pow(2,fails-1));
    e.textContent='بيانات الدخول غير صحيحة';
    b.disabled=false; b.textContent='دخول';
  }
});
